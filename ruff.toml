line-length = 100
exclude = ["venv", "migrations"]

[lint]
# E/W = pycodestyle, F = pyflakes (undefined names, unused imports),
# I = import sorting, UP = modern Python idioms, B = common bug patterns.
select = ["E", "W", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# Settings modules intentionally use `from .base import *`.
"config/settings/*.py" = ["F403", "F405"]
